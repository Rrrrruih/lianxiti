let currentLang = 'zh';

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
            <div class="question-title">
                <strong>第 ${q.num} 题：</strong>${q.words} <br>
                <small style="color:#555; font-weight:normal; display:block; margin-top:5px;">💡 ${q.translations[currentLang]}</small>
            </div>
            <div class="options" id="options-${qIdx}"></div>
            <div class="result-box" id="result-${qIdx}"></div>
            <span class="hint-text" id="hint-${qIdx}">📌 ${q.hint[currentLang]}</span>
        `;
        container.appendChild(card);

        const optionsContainer = document.getElementById(`options-${qIdx}`);
        q.options.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => checkAnswer(qIdx, oIdx);
            optionsContainer.appendChild(btn);
        });
    });
}

function checkAnswer(qIdx, oIdx) {
    const selectedOption = quizData[qIdx].options[oIdx];
    const resultBox = document.getElementById(`result-${qIdx}`);
    resultBox.style.display = 'block';
    resultBox.className = 'result-box ' + (selectedOption.isCorrect ? 'correct' : 'incorrect');
    resultBox.innerText = selectedOption.rationale[currentLang];
}

function switchLanguage(lang, event) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderQuiz();
}
